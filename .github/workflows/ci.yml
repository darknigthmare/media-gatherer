name: CI

on:
  push:
    branches:
      - master
    tags:
      - "**"
  pull_request:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_type == 'branch' }}

jobs:
  qa-linux:
    name: QA and audit (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run QA
        run: npm run qa

      - name: Audit production dependencies
        run: npm audit --omit=dev

  qa-windows:
    name: QA (Windows)
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run QA
        run: npm run qa

  build-exe-windows:
    name: Build Windows EXE
    if: ${{ github.event_name == 'release' || github.ref_type == 'tag' }}
    needs:
      - qa-linux
      - qa-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out release revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build executable
        run: npm run build:exe

      - name: Sign executable when a certificate is configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          MEDIA_GATHERER_SIGNING_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificateConfigured = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          $passwordConfigured = -not [string]::IsNullOrWhiteSpace($env:MEDIA_GATHERER_SIGNING_PASSWORD)
          if (-not $certificateConfigured -and -not $passwordConfigured) {
            Write-Host "No signing certificate configured; keeping the verified unsigned build."
            exit 0
          }
          if (-not $certificateConfigured -or -not $passwordConfigured) {
            throw "Both WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD are required."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "mediagatherer-signing.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
            )
            & ".\scripts\sign-windows.ps1" `
              -ExecutablePath "dist\MediaGatherer.exe" `
              -PfxPath $certificatePath
          } finally {
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }

      - name: Verify MZ header and create checksum
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/MediaGatherer.exe"
          $stream = [System.IO.File]::OpenRead($exe)
          try {
            $firstByte = $stream.ReadByte()
            $secondByte = $stream.ReadByte()
          } finally {
            $stream.Dispose()
          }

          if ($firstByte -ne 0x4D -or $secondByte -ne 0x5A) {
            throw "dist/MediaGatherer.exe does not have a valid MZ header."
          }

          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "$hash  MediaGatherer.exe" |
            Set-Content -Path "dist/MediaGatherer.exe.sha256" -Encoding ascii
          Write-Host "Verified MZ header and SHA256: $hash"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: MediaGatherer-Windows-${{ github.event.release.tag_name || github.ref_name }}
          path: |
            dist/MediaGatherer.exe
            dist/MediaGatherer.exe.sha256
          if-no-files-found: error
          retention-days: 30
